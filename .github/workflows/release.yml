name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
        type: string
      source_ref:
        description: Private source branch, tag, or commit
        required: true
        default: main
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  SOURCE_REPO: canxin121/netdisk115rs

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      source_version: ${{ steps.meta.outputs.source_version }}
    steps:
      - name: Validate release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid tag: $TAG" >&2; exit 64; }
      - name: Resolve private source ref
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}
          persist-credentials: false
      - id: meta
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' source/Cargo.toml | head -n 1)"
          [[ "v$version" == "$TAG" ]] || { echo "Cargo.toml version v$version does not match requested tag $TAG" >&2; exit 65; }
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_version=$version" >> "$GITHUB_OUTPUT"

  build-test:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            asset: netdisk115rs-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            asset: netdisk115rs-linux-arm64.tar.gz
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            asset: netdisk115rs-macos-x86_64.tar.gz
          - os: macos-15
            platform: macos
            arch: arm64
            asset: netdisk115rs-macos-arm64.tar.gz
          - os: windows-2025
            platform: windows
            arch: x86_64
            asset: netdisk115rs-windows-x86_64.zip
          - os: windows-11-arm
            platform: windows
            arch: arm64
            asset: netdisk115rs-windows-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Checkout exact private source commit
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          ssh-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}
          persist-credentials: false
      - name: Checkout exact private source commit (Windows ARM64 ACL workaround)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        env:
          SOURCE_REPO_SSH_KEY: ${{ secrets.SOURCE_REPO_SSH_KEY }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: ./scripts/checkout-private-source.ps1 -Repository "$env:SOURCE_REPO" -Ref "$env:SOURCE_SHA" -Destination "$PWD/source"
      - uses: oven-sh/setup-bun@v2
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        with:
          bun-version: 1.4.0
      - name: Setup Bun on Windows ARM64 without managed ZIP extraction
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: ./scripts/setup-bun-windows-arm64.ps1 -Version 1.4.0
      - name: Build web assets
        shell: bash
        working-directory: source/web
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Build backend
        shell: bash
        working-directory: source
        run: cargo build --release --locked
      - name: Test macOS File Provider contracts
        if: runner.os == 'macOS'
        shell: bash
        run: swift test --package-path source/macos
      - name: Import Apple Developer ID signing identity
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: ./scripts/import-macos-signing.sh "$PWD/source"
      - name: Build Developer ID signed macOS mount app
        if: runner.os == 'macOS'
        shell: bash
        env:
          NETDISK115RS_MACOS_SIGNING_MODE: developer-id
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/build-macos-app.sh "$PWD/source" "$PWD/source/target/macos" "${{ matrix.arch }}"
      - name: Notarize macOS mount app
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY_ID:?missing APPLE_API_KEY_ID secret}"
          : "${APPLE_API_ISSUER_ID:?missing APPLE_API_ISSUER_ID secret}"
          : "${APPLE_API_KEY_P8:?missing APPLE_API_KEY_P8 secret}"
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          APPLE_API_KEY_PATH="$key" ./scripts/notarize-macos-app.sh "$PWD/source/target/macos/Netdisk115.app"
          rm -f "$key"
      - name: Build Windows service host
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --manifest-path service/windows-wrapper/Cargo.toml --release --locked
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/package-unix.sh "$PWD/source" "$PWD/dist" "${{ matrix.platform }}" "${{ matrix.arch }}"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SourceDir "$PWD/source" -OutDir "$PWD/dist" -Arch "${{ matrix.arch }}"
      - name: Smoke test Linux installer/service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ./install.sh --archive "$PWD/dist/${{ matrix.asset }}"
          sudo systemctl is-enabled --quiet netdisk115rs.service
          sudo systemctl is-active --quiet netdisk115rs.service
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/ >/dev/null
      - name: Smoke test notarized macOS app and installer/service
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="$PWD/dist/${{ matrix.asset }}"
          app=/Applications/Netdisk115.app
          ./install.sh --archive "$archive"
          sudo launchctl print system/com.canxin.netdisk115rs >/dev/null
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/ >/dev/null
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute -vv "$app"
          xcrun stapler validate "$app"
          lipo "$app/Contents/MacOS/Netdisk115" -verify_arch "${{ matrix.arch }}"
          ./install.sh --archive "$archive"
          codesign --verify --deep --strict "$app"
      - name: Smoke test Windows installer/service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -ArchivePath "$PWD/dist/${{ matrix.asset }}"
          $svc = Get-CimInstance Win32_Service -Filter "Name='netdisk115rs'"
          if (-not $svc -or $svc.State -ne 'Running' -or $svc.StartMode -ne 'Auto') { throw 'Windows Service verification failed' }
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            try { if ((Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8080/' -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ok) { throw 'HTTP health check failed' }
      - name: Cleanup Unix test service
        if: always() && runner.os != 'Windows'
        shell: bash
        run: ./uninstall.sh --purge || true
      - name: Cleanup macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${NETDISK115RS_MACOS_KEYCHAIN:-}" ]]; then security delete-keychain "$NETDISK115RS_MACOS_KEYCHAIN" || true; fi
      - name: Cleanup Windows test service
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./uninstall.ps1 -Purge
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [prepare, build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum netdisk115rs-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          notes="Closed-source binary release built from private source ref \`$SOURCE_REF\` at commit \`$SOURCE_SHA\`. All six native installer/service jobs passed before publishing; macOS packages also include a Developer ID-signed and notarized Netdisk115 File Provider app."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            edit_flags=(--title "$TAG" --notes "$notes" "--prerelease=$PRERELEASE")
            if [[ "$PRERELEASE" != true ]]; then edit_flags+=(--latest); fi
            gh release edit "$TAG" "${edit_flags[@]}"
          else
            flags=(--title "$TAG" --target "$GITHUB_SHA" --notes "$notes")
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); else flags+=(--latest); fi
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
