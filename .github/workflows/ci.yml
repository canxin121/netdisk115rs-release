name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: canxin121/netdisk115rs

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh uninstall.sh scripts/package-unix.sh
          pwsh -NoProfile -Command '$null=[scriptblock]::Create((Get-Content ./install.ps1 -Raw)); $null=[scriptblock]::Create((Get-Content ./uninstall.ps1 -Raw)); $null=[scriptblock]::Create((Get-Content ./scripts/package-windows.ps1 -Raw))'
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Windows service wrapper source
        run: cargo check --manifest-path service/windows-wrapper/Cargo.toml

  build-install-smoke:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            asset: netdisk115rs-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            asset: netdisk115rs-linux-arm64.tar.gz
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            asset: netdisk115rs-macos-x86_64.tar.gz
          - os: macos-15
            platform: macos
            arch: arm64
            asset: netdisk115rs-macos-arm64.tar.gz
          - os: windows-2025
            platform: windows
            arch: x86_64
            asset: netdisk115rs-windows-x86_64.zip
          - os: windows-11-arm
            platform: windows
            arch: arm64
            asset: netdisk115rs-windows-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: main
          path: source
          ssh-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build web assets
        shell: bash
        working-directory: source/web
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Build backend
        shell: bash
        working-directory: source
        run: cargo build --release --locked

      - name: Build Windows service host
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --manifest-path service/windows-wrapper/Cargo.toml --release --locked

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/package-unix.sh "$PWD/source" "$PWD/dist" "${{ matrix.platform }}" "${{ matrix.arch }}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SourceDir "$PWD/source" -OutDir "$PWD/dist" -Arch "${{ matrix.arch }}"

      - name: Install and verify Linux systemd service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ./install.sh --archive "$PWD/dist/${{ matrix.asset }}"
          sudo systemctl is-enabled --quiet netdisk115rs.service
          sudo systemctl is-active --quiet netdisk115rs.service
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/ >/dev/null
          /usr/local/bin/netdisk115rs --version

      - name: Install and verify macOS LaunchDaemon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ./install.sh --archive "$PWD/dist/${{ matrix.asset }}"
          sudo launchctl print system/com.canxin.netdisk115rs >/dev/null
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/ >/dev/null
          /usr/local/bin/netdisk115rs --version

      - name: Install and verify Windows Service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -ArchivePath "$PWD/dist/${{ matrix.asset }}"
          $svc = Get-CimInstance Win32_Service -Filter "Name='netdisk115rs'"
          if (-not $svc) { throw 'Windows Service was not created' }
          if ($svc.State -ne 'Running') { throw "Windows Service state is $($svc.State)" }
          if ($svc.StartMode -ne 'Auto') { throw "Windows Service start mode is $($svc.StartMode)" }
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              if ((Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8080/' -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ok) { throw 'HTTP health check failed' }
          & "$env:ProgramFiles\netdisk115rs\netdisk115rs.exe" --version

      - name: Cleanup Unix service
        if: always() && runner.os != 'Windows'
        shell: bash
        run: ./uninstall.sh --purge || true

      - name: Cleanup Windows service
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./uninstall.ps1 -Purge

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
